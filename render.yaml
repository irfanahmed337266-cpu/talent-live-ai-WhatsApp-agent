# Render Blueprint for the Talent Live dashboard.
#
# Only the dashboard is deployed here. The Telegram bot itself runs
# locally via long-polling (app/telegram_polling.py, started at Windows
# logon - see scripts/) - that's a deliberate choice, not a limitation:
# polling needs no public URL at all, so there's nothing to host for it.
# If that ever changes (e.g. wanting the bot to survive the laptop being
# off), add a second "worker" service here running the same command -
# see HANDOFF.md's Deployment section for the full definition.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Secrets marked
# `sync: false` are prompted for in the dashboard - never committed here.
#
# SECURITY NOTE: the dashboard's only protection is DASHBOARD_TOKEN (as a
# query param or Authorization header) - anyone with the URL + token can
# read candidate names, scores, and phone numbers. Use a long random
# value, not something guessable.

services:
  - type: web
    name: talent-live-dashboard
    runtime: python
    # Free tier is a real option here (unlike Background Workers, which
    # have none) since this is only used on-demand as an internal tool -
    # the tradeoff is it spins down after ~15 min idle and takes ~30-50s
    # to wake up on the next visit. Switch to "starter" in the Render
    # dashboard any time if that delay becomes annoying.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DASHBOARD_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
