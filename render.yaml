# Render Blueprint for the Talent Live Telegram agent.
#
# Two independent services, deployed from the same repo:
#
# 1. talent-live-telegram-bot (Background Worker)
#    No open port, no domain/TLS/webhook needed - it long-polls Telegram
#    directly (see app/telegram_polling.py). This is what actually runs
#    the interview.
#
# 2. talent-live-dashboard (Web Service)
#    Serves GET /health and GET /owner/dashboard (app/api/dashboard.py) at
#    a public onrender.com URL, protected by DASHBOARD_TOKEN. It also
#    happens to expose the (unused) POST /telegram/webhook route from
#    app/api/telegram.py - harmless, since the bot uses polling, not
#    webhooks, in this deployment.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and creates both services. Secrets marked `sync: false` are prompted
# for in the dashboard - never committed here.
#
# SECURITY NOTE: the dashboard's only protection is DASHBOARD_TOKEN (as a
# query param or Authorization header) - anyone with the URL + token can
# read candidate names, scores, and phone numbers. Use a long random
# value, not something guessable.

services:
  - type: worker
    name: talent-live-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.telegram_polling
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_CONTACT_PHONE
        sync: false

  - type: web
    name: talent-live-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DASHBOARD_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
